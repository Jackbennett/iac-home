apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  inputs:
    - name: flux-operator
      namespace: flux-system
      version: "*"
      interval: 12h
  resources:
   - apiVersion: source.toolkit.fluxcd.io/v1
     kind: OCIRepository
     metadata:
      name: << inputs.name >>
      namespace: << inputs.namespace >>
     spec:
      interval: << inputs.interval >>
      url: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator
      layerSelector:
        mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
        operation: copy
      ref:
        semver: << inputs.version | quote >>
   - apiVersion: helm.toolkit.fluxcd.io/v2
     kind: HelmRelease
     metadata:
        name: << inputs.name >>
        namespace: << inputs.namespace >>
     spec:
      interval: 1h
      releaseName: << inputs.name >>
      serviceAccountName: << inputs.name >>
      driftDetection:
        mode: enabled
      chartRef:
        kind: OCIRepository
        name: << inputs.name >>
